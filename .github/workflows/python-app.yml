name: Python CI

on:
  push:
    branches:
      - main
      - action-branch

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install scikit-learn joblib pytest

    - name: Train models
      run: |
        python train.py

    - name: Run tests
      run: |
        pytest